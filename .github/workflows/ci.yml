name: StudyPilot CI/CD Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-build:
    name: Typecheck, Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: ESLint Code Quality Check
        run: pnpm lint

      - name: Run Test Suite (Vitest + Web Tests + Prompt Adherence)
        run: pnpm test

      - name: Production Build (Next.js)
        run: pnpm build
